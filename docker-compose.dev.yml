name: nikita-portfolio-dev

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: nikita-portfolio:dev
    container_name: nikita-portfolio-dev
    ports:
      - "4321:4321"
    volumes:
      # Исходники монтируются для hot reload; зависимости живут в named volume
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: development
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  node_modules:
