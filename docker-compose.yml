services:
  web:
    build:
      context: .
      args:
        # Значения подставляются из .env в корне проекта.
        # Изменение ссылок требует пересборки: docker compose up --build
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
        TELEGRAM_URL: ${TELEGRAM_URL:-}
        VK_URL: ${VK_URL:-}
    image: nikita-portfolio:latest
    container_name: nikita-portfolio
    ports:
      - "8080:80"
    restart: unless-stopped
