server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # Security headers (не перекрываются ниже: в location используется только expires)
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

  # Хэшированные ассеты Astro — долгий кэш
  location /_astro/ {
    expires 365d;
    try_files $uri =404;
  }

  # Шрифты и изображения
  location ~* \.(woff2?|webp|avif|png|jpe?g|svg|ico)$ {
    expires 30d;
    try_files $uri =404;
  }

  # HTML — всегда свежий
  location / {
    expires -1;
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
}
