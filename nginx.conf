server {
  listen 80;
  server_name _;

  # Не раскрывать версию nginx
  server_tokens off;

  # Относительные редиректы: /terms -> /terms/ не должен терять порт
  # при локальном запуске на :8080 и работать за reverse proxy.
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # Security headers (не перекрываются ниже: в location используется только expires)
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  # script-src/style-src (с хэшами инлайн-скриптов Astro) живут в <meta> на каждой
  # странице — см. security.csp в astro.config.mjs. Здесь default-src/script-src
  # НЕ задаются, иначе они пересеклись бы с meta-политикой и заблокировали хэши.
  add_header Content-Security-Policy "img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
  # HSTS включайте только когда сайт стоит за TLS-терминатором (домен + HTTPS):
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Скрытые файлы не отдаём (кроме ACME-челленджей)
  location ^~ /.well-known/ {
    try_files $uri =404;
  }
  location ~ /\.(?!well-known) {
    deny all;
  }

  # Хэшированные ассеты Astro — долгий кэш
  location /_astro/ {
    expires 365d;
    try_files $uri =404;
  }

  # Шрифты и изображения
  location ~* \.(woff2?|webp|avif|png|jpe?g|svg|ico)$ {
    expires 30d;
    try_files $uri =404;
  }

  # HTML — всегда свежий
  location / {
    expires -1;
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
}
